<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- styleSheets -->
    <link rel="stylesheet" href="style.css">
    <link href="css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <!-- Heading  -->
    <nav class="navbar bg-primary" data-bs-theme="dark">
        <h1>Task tracker</h1>
    </nav>

    <main>
        <!-- User Input  -->
        <div id="task-input" class="input-group mb-1">
            <input type="text" class="form-control" placeholder="New Task...." id="taskInput" aria-label="Task Name"
                aria-describedby="button-addon2">
            <input type="text" class="form-control" placeholder="New Task...." id="taskDisc"
                aria-label="Task Discription" aria-describedby="button-addon2">
            <input type="date" class="form-control" placeholder="New Task...." id="dueDate" 
                aria-label="Date" aria-describedby="button-addon2">
            <button class="btn btn-outline-secondary" type="button" id="button-addon2 addTask" onclick="addTask()">Add
                task</button>
        </div>

        <!-- Task display  -->
        <div id="taskLists">
            <h2> Tasks in Progress:</h2>
            <table class="table table-dark table-striped-columns" id="table">
                <thead>
                    <tr>
                        <th>Task Name</th>
                        <th>Task Discription</th>
                        <th>Due date</th>
                        <th>Status</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="pTableBody">

                </tbody>
            </table>
            <h2> Completed Tasks:</h2>
            <table class="table table-dark table-striped-columns" id="table">
                <thead>
                    <tr>
                        <th>Task Name</th>
                        <th>Task Discription</th>
                        <th>Due Date</th>
                        <th>Status</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="cTableBody">

                </tbody>
            </table>
        </div>
    </main>

    <!-- scripts -->
    <script src="index.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
